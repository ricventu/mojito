# The pnpm workspace: `apps/*` (server, web) and `packages/*` (shared), driven by the root
# scripts. The root is not a package of its own. pnpm 11 reads its settings from here.
#
# pnpm 10+ refuses to run a dependency's install scripts unless it is named here
# (`allowBuilds` in 11 — an object, not a list). All three entries are load-bearing, and
# all fail *silently* if dropped:
#
#   node-pty        the native module the terminal is built on. Without its build there is
#                   no pty binding and the server dies on import.
#   better-sqlite3  the server's database. Without its build there is no native binding
#                   and the server dies on first import.
#   esbuild         tsx's and tsup's bundler. Its postinstall is what puts the platform
#                   binary in place.
#
# Two esbuild majors are installed (tsx's and vitest's); the key is the package name, so
# one entry covers both.
packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  node-pty: true
